apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-domainx
  labels:
    app: domainx
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: domainx
  template:
    metadata:
      labels:
        app: domainx
    spec:
      containers:
        - name: domainx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
